enhancements:
  reflectivity331:
    name: Reflectivity331
    sensor: omps
    operations:
      - name: colorize
        method: !!python/name:polar2grid.enhancements.shared.colorize
        kwargs:
          palettes:
            - min_value: 0.0
              max_value: 100.0
              colors: "rainbow"
